<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Lab — Build it. Test it. Break it. Improve it.</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="logo">AI</div><div><strong>AI Lab</strong><span>Build it. Test it. Break it. Improve it.</span></div></div>
      <div class="student-controls">
        <input type="hidden" id="studentName" value="Student" />
        <div style="font-size:.82rem;line-height:1.4;color:#697386;padding:.65rem .75rem;border:1px solid #dfe4ec;border-radius:10px;background:#fff;margin-bottom:.7rem;">No student name or identifying information is required.</div>
        <label>Year level<select id="yearLevel"><option>7</option><option>8</option><option selected>9</option><option>10</option><option>11</option><option>12</option></select></label>
      </div>
      <div class="overall-progress"><div><span>Course progress</span><strong id="progressText">0% complete</strong></div><div class="progress-track"><div id="progressBar" class="progress-fill"></div></div></div>
      <nav id="lessonNav"></nav>
      <div class="sidebar-actions"><button id="teacherToggle" class="secondary">Teacher View</button><button id="resetBtn" class="ghost">Reset demo</button></div>
      <div class="eduappsplus-card" style="margin:1rem 0 0;padding:1rem;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(255,255,255,.05);font-size:.82rem;line-height:1.45;color:#cbd5e1;">
        <strong style="display:block;color:#fff;font-size:.92rem;margin-bottom:.35rem;">Created by EDU Apps Plus</strong>
        <span>Custom education software and digital learning applications designed for schools, teachers and students.</span>
        <a href="https://www.eduappsplus.com.au" target="_blank" rel="noopener" style="display:inline-block;margin-top:.65rem;color:#8ea7ff;font-weight:700;text-decoration:none;">www.eduappsplus.com.au ↗</a>
      </div>
    </aside>
    <main class="main">
      <section id="studentView"></section>
      <section id="teacherView" class="hidden"></section>
    </main>
  </div>
  <script src="app.js"></script>
  <script src="data-centre.js"></script>
  <script src="video-worksheets.js"></script>
</body>
</html>
